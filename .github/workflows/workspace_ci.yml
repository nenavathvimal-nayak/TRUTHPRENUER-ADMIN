name: Truthprenuer Workspace Integration CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-validation:
    name: Dual-Repository Integration & Submodule Verification
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Parent Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Submodule Gitlink Availability
        run: |
          git submodule status --recursive
          RECORDED_SHA=$(git ls-tree HEAD USERS/FLUTTER/taeed_flutter_source | awk '{print $3}')
          echo "Recorded Submodule SHA in Parent: ${RECORDED_SHA}"
          test -n "${RECORDED_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ADMIN/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: USERS/FLUTTER/taeed_flutter_source/backend/requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Subsystem Dependencies
        run: |
          # 1. Admin dependencies
          (cd ADMIN && npm ci)
          
          # 2. Backend virtualenv and dependencies
          (cd USERS/FLUTTER/taeed_flutter_source && python -m venv backend/venv && backend/venv/bin/pip install --upgrade pip && backend/venv/bin/pip install -r backend/requirements.txt)
          
          # 3. Flutter client packages
          (cd USERS/FLUTTER/taeed_flutter_source/USERS && flutter pub get)

      - name: Execute Workspace Validator
        run: |
          chmod +x DEVTOOLS/SCRIPTS/validate_workspace.sh
          ./DEVTOOLS/SCRIPTS/validate_workspace.sh
